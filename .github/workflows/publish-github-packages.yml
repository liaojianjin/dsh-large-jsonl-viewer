name: Publish GitHub Packages

on:
  workflow_dispatch:
  release:
    types: [published]
  # Bootstrap the first publication when this workflow is added to main.
  push:
    branches: [main]
    paths: ['.github/workflows/publish-github-packages.yml']

permissions:
  contents: read

concurrency:
  group: github-packages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'liaojianjin/dsh-large-jsonl-viewer'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const pkg = JSON.parse(readFileSync('packages/plugins/large-jsonl-viewer/package.json', 'utf8'));
          assert.equal(event.release.tag_name, `v${pkg.version}`);
          JS
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and check the unchanged npm identity
        run: |
          pnpm build
          pnpm typecheck
          pnpm test
          pnpm test:integration
          node scripts/pack.mjs artifacts/npm-check
          node scripts/package-test.mjs artifacts/npm-check/dsh-large-jsonl-viewer-$(node -p "require('./packages/plugins/large-jsonl-viewer/package.json').version").tgz
      - name: Build, test and pack the isolated GitHub identity
        run: node scripts/pack-github.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-package
          path: |
            artifacts/github-packages/*.tgz
            artifacts/github-packages/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@liaojianjin'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-package
          path: artifacts/github-packages
      - name: Verify artifact checksum
        working-directory: artifacts/github-packages
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish and verify the repository-linked package
        run: node scripts/publish-github.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publication summary
        run: |
          echo 'Published and verified @liaojianjin/dsh-large-jsonl-viewer on npm.pkg.github.com.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Repository: https://github.com/liaojianjin/dsh-large-jsonl-viewer' >> "$GITHUB_STEP_SUMMARY"
          echo 'The npmjs.org package dsh-large-jsonl-viewer is unchanged.' >> "$GITHUB_STEP_SUMMARY"
